name: Evaluation integrity
on:
  push:
    branches: [main, submission]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Python
        run: python3 -m compileall -q scripts tests
      - name: Deterministic unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Golden checksum commitments
        run: python3 scripts/verify_commitments.py
      - name: Evaluation schema and comparison
        run: python3 scripts/validate_evals.py
